# https://github.com/actions/deploy-pages#usage
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Zapewnia, że w tym samym czasie działa tylko jedno wdrożenie na GitHub Pages
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Enable Corepack
        run: corepack enable
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm" # Automatyczne cache'owanie zależności npm
          
      - name: Install dependencies
        run: npm ci # Szybsza i bezpieczniejsza instalacja
        
      - name: Build static site
        run: npx nuxt build --preset github_pages
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  # Job wdrożeniowy
  deploy:
    needs: build
    permissions:
      pages: write      # Wymagane do wdrożenia na Pages
      id-token: write   # Wymagane do uwierzytelnienia źródła
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4